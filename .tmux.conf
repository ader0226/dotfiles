# ============================================
# tmux 基本設定
# 放到 ~/.tmux.conf 後重啟 tmux 或 prefix + I 載入
# ============================================

# --- 基本行為 ---
set  -g default-terminal "tmux-256color"      # 256 色支援
set  -ag terminal-overrides ",xterm-256color:RGB" # true color
set  -g history-limit 10000                   # 捲動歷史行數
set  -g base-index 1                          # 視窗編號從 1 開始
setw -g pane-base-index 1                     # 分割窗格編號從 1 開始
set  -g renumber-windows on                   # 關閉視窗後自動重新編號
set  -sg escape-time 10                       # 減少 ESC 延遲（對 vim 很重要）
set  -g focus-events on                       # 讓終端回報 focus 事件

# --- 滑鼠支援 ---
set  -g mouse on                              # 滑鼠選取/捲動/調整窗格大小

# --- 分割視窗（直覺快捷鍵）---
bind | split-window -h -c "#{pane_current_path}"   # prefix + | 水平分割
bind - split-window -v -c "#{pane_current_path}"   # prefix + - 垂直分割
bind c new-window      -c "#{pane_current_path}"   # 新視窗沿用當前路徑

# --- 快速重新載入設定 ---
bind r source-file ~/.tmux.conf \; display "設定已重新載入"

# --- 狀態列美化 ---
set  -g status-position bottom
set  -g status-interval 5
set  -g status-style "bg=#1a1b26,fg=#a9b1d6"

# 左側：session 名稱
set  -g status-left-length 30
set  -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold]  #S #[bg=default] "

# 中間：視窗列表
setw -g window-status-format         "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
setw -g window-status-separator      ""

# 右側：主機名稱 + 時間
set  -g status-right-length 50
set  -g status-right "#[fg=#565f89]#H  #[fg=#7aa2f7]%m/%d %H:%M "

# 分隔線
set  -g pane-border-style        "fg=#3b4261"
set  -g pane-active-border-style "fg=#7aa2f7"

# 訊息列
set  -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
